name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Clean stale build output
        run: rm -rf dist *.tsbuildinfo

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Integration tests (real FTP & SFTP servers)
        run: RUN_INTEGRATION=1 TZ=UTC npm test

      - name: Prepublish lint (n8n node validation)
        run: npx eslint -c .eslintrc.prepublish.js nodes package.json
